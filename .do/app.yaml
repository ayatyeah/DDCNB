name: ddcn-story
services:
  - name: web
    github:
      repo: ayatyeah/DDCNB
      branch: master
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    run_command: npm start
    http_port: 3000
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
